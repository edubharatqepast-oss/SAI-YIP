<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simon Says — SAI.YIP</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0
  }
  :root {
    --sai-brand: #7aa2f7;
    --sai-brand-2: #bb9af7;
    --sai-ok: #9ece6a;
    --sai-accent: #f7768e;
    --sai-bg: #1a1b26;
    --sai-panel: #24283b;
    --sai-text: #c0caf5;
    --sai-text-dim: #9aa5ce;
    --sai-border: #414868
  }
  html {
    -webkit-tap-highlight-color: transparent
  }
  body {
    background: var(--sai-bg);
    color: var(--sai-text);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 1rem;
    gap: 1rem
  }
  h1 {
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: -0.5px
  }
  .hud {
    display: flex;
    gap: 1.5rem;
    font-size: 0.95rem;
    color: var(--sai-text-dim)
  }
  .hud b {
    color: var(--sai-text);
    font-weight: 600
  }
  #status {
    margin: 0.5rem 0;
    font-size: 0.95rem;
    color: var(--sai-text-dim);
    min-height: 1.25rem
  }
  .hint {
    font-size: 0.8rem;
    color: var(--sai-text-dim);
    margin-top: 0.25rem
  }
  .board {
    position: relative;
    width: min(400px, 92vw);
    min-width: 260px;
    aspect-ratio: 1;
    margin: 0.5rem 0
  }
  .pad {
    position: absolute;
    width: 47%;
    height: 47%;
    border: 2px solid var(--sai-border);
    cursor: pointer;
    outline: none;
    display: grid;
    place-items: center;
    touch-action: manipulation;
    transition: border-color 0.15s ease
  }
  .pad:nth-child(1) {
    top: 0;
    left: 0;
    border-radius: 140px 0 0 0
  }
  .pad:nth-child(2) {
    top: 0;
    right: 0;
    border-radius: 0 140px 0 0
  }
  .pad:nth-child(3) {
    bottom: 0;
    left: 0;
    border-radius: 0 0 0 140px
  }
  .pad:nth-child(4) {
    bottom: 0;
    right: 0;
    border-radius: 0 0 140px 0
  }
  .pad:focus-visible {
    border-color: var(--c);
    box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.15)
  }
  .pad-light {
    width: 78%;
    height: 78%;
    border-radius: 50%;
    background: var(--c);
    opacity: 0.55;
    box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.4);
    transition: opacity 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease
  }
  .pad.active .pad-light {
    opacity: 1;
    box-shadow: 0 0 28px var(--c), inset 0 0 24px rgba(255, 255, 255, 0.35);
    transform: scale(1.12)
  }
  button#start {
    margin-top: 1rem;
    padding: 0.75rem 1.75rem;
    font-size: 1rem;
    font-weight: 600;
    color: var(--sai-text);
    background: var(--sai-panel);
    border: 1px solid var(--sai-border);
    border-radius: 8px;
    cursor: pointer;
    touch-action: manipulation;
    transition: border-color 0.15s ease, background 0.15s ease
  }
  button#start:focus-visible {
    border-color: var(--sai-brand);
    box-shadow: 0 0 0 3px rgba(122, 162, 247, 0.35)
  }
  button#start:hover:not(:disabled) {
    border-color: var(--sai-brand)
  }
  button#start:disabled {
    opacity: 0.55;
    cursor: not-allowed
  }
  @media (prefers-reduced-motion: reduce) {
    .pad,
    .pad-light,
    button#start {
      transition: none !important;
      animation: none !important
    }
    .pad.active .pad-light {
      transform: none
    }
  }
</style>
</head>
<body>
  <h1>Simon Says</h1>
  <div class="hud" role="region" aria-label="Score" aria-live="polite">
    <div>Round <b id="round">0</b></div>
    <div>Score <b id="score">0</b></div>
  </div>
  <div id="status" role="status" aria-live="polite">Press Start to play</div>
  <div class="board" role="grid" aria-label="Simon pads">
    <button class="pad" data-pad="0" style="--c: var(--sai-accent)" aria-label="Red pad" aria-keyshortcuts="1">
      <div class="pad-light"></div>
    </button>
    <button class="pad" data-pad="1" style="--c: var(--sai-ok)" aria-label="Green pad" aria-keyshortcuts="2">
      <div class="pad-light"></div>
    </button>
    <button class="pad" data-pad="2" style="--c: var(--sai-brand)" aria-label="Blue pad" aria-keyshortcuts="3">
      <div class="pad-light"></div>
    </button>
    <button class="pad" data-pad="3" style="--c: var(--sai-brand-2)" aria-label="Yellow pad" aria-keyshortcuts="4">
      <div class="pad-light"></div>
    </button>
  </div>
  <p class="hint">Keyboard: 1–4 or arrow keys</p>
  <button id="start" type="button">Start Game</button>
  <script>
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const audio = new AudioContext();
    const tones = [261.63, 329.63, 392.00, 523.25];
    const pads = document.querySelectorAll('.pad');
    const roundEl = document.getElementById('round');
    const scoreEl = document.getElementById('score');
    const statusEl = document.getElementById('status');
    const startBtn = document.getElementById('start');
    let sequence = [];
    let roundNum = 0;
    let score = 0;
    let playerIndex = 0;
    let busy = false;
    let active = false;
    function tone(index) {
      if (audio.state === 'suspended') {
        audio.resume()
      }
      const osc = audio.createOscillator();
      const gain = audio.createGain();
      osc.type = 'sine';
      osc.frequency.value = tones[index];
      gain.gain.setValueAtTime(0.06, audio.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.4);
      osc.connect(gain);
      gain.connect(audio.destination);
      osc.start();
      osc.stop(audio.currentTime + 0.4)
    }
    function light(index) {
      const pad = pads[index];
      pad.classList.add('active');
      pad.setAttribute('aria-pressed', 'true');
      tone(index);
      setTimeout(() => {
        pad.classList.remove('active');
        pad.setAttribute('aria-pressed', 'false')
      }, 300)
    }
    function playSequence() {
      busy = true;
      active = false;
      statusEl.textContent = 'Watch the sequence...';
      let delay = 0;
      sequence.forEach((index) => {
        setTimeout(() => light(index), delay);
        delay += 700
      });
      setTimeout(() => {
        busy = false;
        active = true;
        playerIndex = 0;
        statusEl.textContent = 'Your turn'
      }, delay)
    }
    function nextRound() {
      roundNum += 1;
      score += 1;
      roundEl.textContent = roundNum;
      scoreEl.textContent = score;
      sequence.push(Math.floor(Math.random() * 4));
      statusEl.textContent = 'Watch the sequence...';
      busy = true;
      active = false;
      playSequence()
    }
    function endGame() {
      active = false;
      busy = true;
      statusEl.textContent = 'Wrong pad — game over. Score ' + score;
      setTimeout(() => {
        busy = false;
        startBtn.disabled = false;
        startBtn.textContent = 'Play Again'
      }, 1200)
    }
    function handlePad(index) {
      if (busy || !active) {
        return
      }
      light(index);
      if (index === sequence[playerIndex]) {
        playerIndex += 1;
        if (playerIndex === sequence.length) {
          active = false;
          busy = true;
          statusEl.textContent = 'Nice — next round';
          setTimeout(nextRound, 800)
        }
      } else {
        endGame()
      }
    }
    function startGame() {
      sequence = [];
      roundNum = 0;
      score = 0;
      playerIndex = 0;
      roundEl.textContent = '0';
      scoreEl.textContent = '0';
      busy = false;
      active = false;
      statusEl.textContent = 'Watch the sequence...';
      startBtn.disabled = true;
      startBtn.textContent = 'Playing…';
      nextRound()
    }
    pads.forEach((pad, index) => {
      pad.addEventListener('click', () => handlePad(index))
    });
    window.addEventListener('keydown', (event) => {
      if (busy || !active) {
        return
      }
      let index;
      if (event.key >= '1' && event.key <= '4') {
        index = Number(event.key) - 1
      } else if (event.key === 'ArrowUp') {
        index = 0
      } else if (event.key === 'ArrowRight') {
        index = 1
      } else if (event.key === 'ArrowDown') {
        index = 2
      } else if (event.key === 'ArrowLeft') {
        index = 3
      } else {
        return
      }
      event.preventDefault();
      handlePad(index)
    });
    startBtn.addEventListener('click', startGame)
  </script>
</body>
</html>
